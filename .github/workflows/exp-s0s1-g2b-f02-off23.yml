name: S0 G2B cooperative PG17 and OpenAI OFF23 F02 readback repair
on:
  push:
    branches: [exp/s0s1-g2b-f02-off23-repair-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-scope-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --experimental-strip-types
      M18_META_PIN: ${{ github.workspace }}/_meta_pin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          path: _meta_pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Scope check and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _meta_pin rev-parse HEAD)" = 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          python3 -B - <<'PY'
          import ast,subprocess,pathlib
          base='7cb9d3f241337203fffc144a5b19ea1583d44121'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          needed={'.github/workflows/exp-s0s1-g2b-f02-off23.yml',
            'integration/s0s1_f02_cycle/pg17_service.py',
            'integration/s0s1_f02_cycle/test_off23_pg17.py',
            'integration/s0s1_pd_g2b/pg17_schema.sql',
            'integration/s0s1_pd_g2b/pg17_service.py',
            'integration/s0s1_pd_g2b/test_pg17_service.py'}
          extra={'docs/contratos/s0_pre_dispatch/S0_G2B_OFF23_F02_PG17_20261101.md'}
          assert needed<=changed and changed<=needed|extra, sorted(changed)
          for p in ('integration/s0s1_f02_cycle/pg17_service.py',
            'integration/s0s1_f02_cycle/test_off23_pg17.py',
            'integration/s0s1_pd_g2b/pg17_service.py',
            'integration/s0s1_pd_g2b/test_pg17_service.py'):
           ast.parse(pathlib.Path(p).read_text())
          print('OFF23/G2B isolated S0 code diff and syntax PASS')
          PY
      - name: Original Meta M18 pinned 62-case regression
        run: node --test _meta_pin/integrations/whatsapp-meta/wa18-dispatch-boundary-offline.test.ts
      - name: G2 contract manifest and old Meta boundary
        run: |
          node --test integration/s0s1_pd_g2/test_contract.mjs
          node --test integration/s0s1_m18_v02/test_interop.mjs
      - name: Ensure pinned source unchanged
        if: always()
        run: test -z "$(git -C _meta_pin status --porcelain)"
  physical-pg17:
    needs: source-scope-and-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      M09_PG17_DISPOSABLE: 'YES'
      M09_PINNED_SOURCE: ${{ github.workspace }}/_m09_pin
      M18_META_PIN: ${{ github.workspace }}/_meta_pin
      M18_V02_PG17_FIXTURE: /tmp/s0_g2b_f02_pg17.json
      NODE_OPTIONS: --experimental-strip-types
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 01ffdb093013664b73b18d23f92aac2202578210
          path: _m09_pin
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          path: _meta_pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check pins and disposable deps
        run: |
          test "$(git -C _m09_pin rev-parse HEAD)" = 01ffdb093013664b73b18d23f92aac2202578210
          test "$(git -C _meta_pin rev-parse HEAD)" = 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          python3 -m pip install 'psycopg[binary]==3.2.13' 'cryptography==46.0.3'
      - name: OFF23 F02 contradictory journal and authority PG17 proofs
        run: python3 -B -m unittest integration.s0s1_f02_cycle.test_off23_pg17 -v
      - name: Original F02 cycle 24 regression
        run: python3 -B -m unittest integration.s0s1_f02_cycle.test_pg17_service -q
      - name: G2B 17 PG17 generation, replay, cancellation and contention cases
        run: python3 -B -m unittest integration.s0s1_pd_g2b.test_pg17_service -v
      - name: G2A snapshots and PRE_DISPATCH original inherited regressions
        run: |
          python3 -B -m unittest integration.s0s1_pd_g2.test_pg17_snapshot -q
          python3 -B -m unittest integration.s0s1_pre_dispatch_v02.test_audit_fixes -q
          python3 -B -m unittest integration.s0s1_pre_dispatch_v02.test_pg17_service -q
          python3 -B -m unittest integration.s0s1_pre_dispatch.test_pg17_service -q
          python3 -B -m unittest integration.s0s1_m09_registry.test_pg17_use_check -q
      - name: Pin Meta M18 physical NO_GRAPH boundary
        run: |
          python3 -B -m integration.s0s1_m18_v02.emit_pg17_evidence
          node --test integration/s0s1_m18_v02/test_interop.mjs
      - name: Cleanup evidence and pin check
        if: always()
        run: |
          rm -f /tmp/s0_g2b_f02_pg17.json
          test -z "$(git -C _m09_pin status --porcelain)"
          test -z "$(git -C _meta_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
