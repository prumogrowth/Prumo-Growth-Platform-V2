name: OAI OFF12 F03 S0 review-only offline regression
on:
  push:
    branches:
      - feat/oai-off12-f03-s0-metadata-gate-20261101
permissions:
  contents: read
concurrency:
  group: oai-off12-f03-review
  cancel-in-progress: false
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact OpenAI branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check OFF11 ancestry and scope of changes
        shell: bash
        run: |
          set -euo pipefail
          base=4714ca50a27b9953a5da7c0389926643fa3d5231
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base" HEAD | sort > /tmp/changed
          cat > /tmp/expected <<'EOF'
          .github/workflows/oai-off12-f03-metadata-lab.yml
          docs/integracoes/openai/OAI_OFF12_S0_F03_METADATA_REVIEW_2026_11_01.md
          docs/integracoes/openai/OAI_ROTEIRO_PROGRESSO_2026_11_01.md
          docs/integracoes/openai/e04_offline_lab/f03-s0-metadata-review-lab.mjs
          docs/integracoes/openai/e04_offline_lab/tests/f03-s0-metadata-review-lab.test.mjs
          EOF
          diff -u /tmp/expected /tmp/changed
          test -z "$(git diff --name-only "$base" HEAD -- backend/ integrations/ frontend/)"
      - name: Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Syntax and complete OFF01..OFF12 regression
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/integracoes/openai/e04_offline_lab/f03-s0-metadata-review-lab.mjs
          node --check docs/integracoes/openai/e04_offline_lab/tests/f03-s0-metadata-review-lab.test.mjs
          npm --prefix docs/integracoes/openai/e04_offline_lab test | tee /tmp/oai-off12.tap
      - name: Enforce exact total 774 PASS and zero skips
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('/tmp/oai-off12.tap','utf8');
          const val=k=>{const x=s.match(new RegExp('# '+k+' (\\d+)'));return x?Number(x[1]):null;};
          const stats={tests:val('tests'),pass:val('pass'),fail:val('fail'),skipped:val('skipped')};
          console.log(JSON.stringify({status:'OAI_OFF12_SYNTHETIC_NOT_RATIFIED',previous:724,off12:50,...stats}));
          if(stats.tests!==774||stats.pass!==774||stats.fail!==0||stats.skipped!==0)process.exit(2);
          NODE
      - name: State non-operational limits
        if: always()
        run: |
          echo 'S0 HistoryResult REVIEW_ONLY_NOT_FROZEN is not a frozen authorized content manifest.'
          echo 'S0 VERIFIED_CONTRACT_PENDING is not model permission. APPLIED_SYNTHETIC_ONLY is not a customer form commit.'
          echo 'No S0/Meta/Frontend writes; no production, merge or deploy.'
