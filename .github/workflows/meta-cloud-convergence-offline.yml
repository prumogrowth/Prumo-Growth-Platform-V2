name: Meta offline convergence
on:
  push:
    branches: [audit/meta-cloud-convergence-20261028-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test integrations/whatsapp-meta/cloud-convergence-scope.test.ts
