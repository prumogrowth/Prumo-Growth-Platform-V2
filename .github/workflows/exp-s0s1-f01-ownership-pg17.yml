name: S0 F01 owner and irreversible handoff PG17 lab
on:
  push:
    branches: [exp/s0s1-f01-ownership-pg17-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-and-original-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      S0_F01_OFF13_PIN: ${{ github.workspace }}/_oai_pin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4efb643d8e6264caef55d21eeb4efb8b3f481a10
          path: _oai_pin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate pinned source and exact isolated delta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _oai_pin rev-parse HEAD)" = 4efb643d8e6264caef55d21eeb4efb8b3f481a10
          python3 -B - <<'PY'
          import ast,subprocess,pathlib
          base='c5f5399fa19bc6234a0de9eb346ef75ad165b7e0'
          changed=set(subprocess.check_output(
            ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          mandatory={
           '.github/workflows/exp-s0s1-f01-ownership-pg17.yml',
           'integration/s0s1_f01_ownership/pg17_schema.sql',
           'integration/s0s1_f01_ownership/pg17_service.py',
           'integration/s0s1_f01_ownership/test_pg17_service.py',
           'integration/s0s1_f01_ownership/emit_off13_evidence.py',
           'integration/s0s1_f01_ownership/test_off13_interop.mjs'}
          optional={'docs/contratos/s0_f01/S0_F01_OWNERSHIP_PG17_20261101.md'}
          assert mandatory<=changed and changed<=mandatory|optional,sorted(changed)
          for name in ('pg17_service.py','test_pg17_service.py',
                       'emit_off13_evidence.py'):
           ast.parse((pathlib.Path('integration/s0s1_f01_ownership')/name).read_text())
          print('F01 scoped source and Python PASS')
          PY
      - name: Original OpenAI OFF13 ownership tests
        run: node --test _oai_pin/docs/integracoes/openai/e04_offline_lab/tests/f01-s0-ownership-review-lab.test.mjs
      - name: S0 F01 compatible with exact original OFF13 module
        run: node --test integration/s0s1_f01_ownership/test_off13_interop.mjs
      - name: Source remains unmodified
        if: always()
        run: test -z "$(git -C _oai_pin status --porcelain)"
  disposable-pg17:
    needs: scope-and-original-openai
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      M09_PG17_DISPOSABLE: 'YES'
      M09_PINNED_SOURCE: ${{ github.workspace }}/_m09_pin
      S0_F01_OFF13_PIN: ${{ github.workspace }}/_oai_pin
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 01ffdb093013664b73b18d23f92aac2202578210
          path: _m09_pin
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4efb643d8e6264caef55d21eeb4efb8b3f481a10
          path: _oai_pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirm original source pins and physical dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _m09_pin rev-parse HEAD)" = 01ffdb093013664b73b18d23f92aac2202578210
          test "$(git -C _oai_pin rev-parse HEAD)" = 4efb643d8e6264caef55d21eeb4efb8b3f481a10
          python3 -m pip install 'psycopg[binary]==3.2.13' 'cryptography==46.0.3'
      - name: PG17 F01 ownership/handoff physical tests
        run: python3 -B -m unittest integration.s0s1_f01_ownership.test_pg17_service -v
      - name: Set ephemeral PG17 F01 observations in runner temp
        run: echo "S0_F01_LAB_EVIDENCE=$RUNNER_TEMP/s0-f01-owner.json" >> "$GITHUB_ENV"
      - name: PG17 owner/handoff evidence to pinned OpenAI OFF13
        run: |
          python3 -B -m integration.s0s1_f01_ownership.emit_off13_evidence
          node --test integration/s0s1_f01_ownership/test_off13_interop.mjs
      - name: Inherited S0 Frontend physical regression
        run: python3 -B -m unittest integration.s0s1_frontend_read.test_pg17_service -q
      - name: Scrub lab artifact and preserve frozen trees
        if: always()
        run: |
          if test -n "$S0_F01_LAB_EVIDENCE"; then rm -f "$S0_F01_LAB_EVIDENCE"; fi
          test -z "$(git -C _m09_pin status --porcelain)"
          test -z "$(git -C _oai_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
