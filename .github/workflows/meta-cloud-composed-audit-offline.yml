name: Meta composed webhook audit (offline)
on:
  push:
    branches: [audit/meta-cloud-composed-cost-snapshot-20261027]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/meta-cloud-composed-observation-20261027]
    paths:
      - 'integrations/whatsapp-meta/**'
      - '.github/workflows/meta-cloud-composed-audit-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HMAC count and trusted config snapshot audit (20)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-composed-observation-audit.test.ts \
            2>&1 | tee "$RUNNER_TEMP/composition-audit.tap"
          grep -qx '# tests 20' "$RUNNER_TEMP/composition-audit.tap"
          grep -qx '# pass 20' "$RUNNER_TEMP/composition-audit.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/composition-audit.tap"
      - name: Composition and specialized regressions (174)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-composed-observation-handoff.test.ts \
            integrations/whatsapp-meta/cloud-failed-status-errors-handoff.test.ts \
            integrations/whatsapp-meta/cloud-unsupported-inbound-handoff.test.ts \
            integrations/whatsapp-meta/cloud-media-metadata-handoff.test.ts \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/composition-audit-regressions.tap"
          grep -qx '# tests 174' "$RUNNER_TEMP/composition-audit-regressions.tap"
          grep -qx '# pass 174' "$RUNNER_TEMP/composition-audit-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/composition-audit-regressions.tap"
