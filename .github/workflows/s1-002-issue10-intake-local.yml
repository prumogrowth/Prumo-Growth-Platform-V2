name: Prumo S1-002 - issue10 intake-only sandbox
on:
  push:
    branches: [feat/s1-002-equipe-prumo]
    paths:
      - '.github/workflows/s1-002-issue10-intake-local.yml'
      - 'supabase/tests/s1_053_issue10_disponibilidade_local_only.sql'
      - 'supabase/tests/s1_053_issue10_disponibilidade_aceite.sql'
      - 'supabase/tests/s1_054_issue10_s0_prova_redistribuicao_local_only.sql'
      - 'supabase/tests/s1_054_issue10_s0_seletiva_aceite.sql'
      - 'scripts/test_s1_002_issue10_human_race.sh'
      - 'supabase/tests/s1_055_issue10_excecao_caso_local_only.sql'
      - 'supabase/tests/s1_055_issue10_excecao_caso_aceite.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prumo-s1-002-issue10-local
  cancel-in-progress: true
jobs:
  issue10-intake-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      PRUMO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prumo_s0_test_issue10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Criar base isolada
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE prumo_s0_test_issue10'
      - name: Executar todas regressões S0 + I11/I12 históricas
        run: bash scripts/run-s1-002-i12-local.sh
      - name: Executar fixture de pausa e onze provas ISSUE10 historicas
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_053_issue10_disponibilidade_local_only.sql
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_053_issue10_disponibilidade_aceite.sql
      - name: Prova S0 e redistribuicao S1 seletiva com 23 gates integrados
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_054_issue10_s0_prova_redistribuicao_local_only.sql
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_054_issue10_s0_seletiva_aceite.sql
      - name: 'Corrida real de sessoes SQL: primeira resposta humana versus movimento'
        run: bash scripts/test_s1_002_issue10_human_race.sh
      - name: 'Excecao manual per-case: verificar dezoito contratos RLS negativos e revogacao'
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_055_issue10_excecao_caso_local_only.sql
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_055_issue10_excecao_caso_aceite.sql
