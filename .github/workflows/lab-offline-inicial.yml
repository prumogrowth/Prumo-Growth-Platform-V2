name: Liberacred - laboratorios offline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Laboratorio offline (dados sinteticos; sem APIs reais)
        required: true
        type: choice
        default: meta
        options:
          - meta
          - frontend
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lab-offline-inicial.yml"
      - "frontend/**"
      - "integrations/whatsapp-meta/**"

permissions:
  contents: read

concurrency:
  group: lab-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Laboratorio Meta - simulacoes offline
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'meta' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Baixar somente a branch auditada (sem credenciais)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "prumogrowth/Prumo-Growth-Platform-V2"
          git clone --quiet --depth 1 --single-branch \
            --branch "feat/meta-s0-ed25519-receipt-interop-20261028" \
            "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/ci-src"
          node --version
          test "$(node -p 'Number(process.versions.node.split(".")[0]) >= 22')" = "true"
      - name: Testar integracao Meta com dados sinteticos
        shell: bash
        working-directory: ${{ runner.temp }}/ci-src
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/*.test.ts

  frontend:
    name: Laboratorio frontend - simulacoes offline
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'frontend' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Baixar somente a branch auditada (sem credenciais)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "prumogrowth/Prumo-Growth-Platform-V2"
          git clone --quiet --depth 1 --single-branch \
            --branch "feat/frontend-plataforma-visual" \
            "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/ci-src"
          node --version
          python3 --version
          test "$(node -p 'Number(process.versions.node.split(".")[0]) >= 22')" = "true"
      - name: Testar interface e exportacao com dados sinteticos
        shell: bash
        working-directory: ${{ runner.temp }}/ci-src
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 frontend/visual/tests/*.test.mjs
          python3 -B -m unittest discover -s frontend/visual/tests \
            -p test_offline_export.py -v
