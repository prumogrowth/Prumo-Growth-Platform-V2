name: S0 F03 - PG17 isolated synthetic integration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/s0-cfi01-f03-auth-preflight-20261020
    paths:
      - backend/s0_f03_*
      - backend/tests/test_s0_f03_*
      - scripts/run-s0-f03-pg17-local.sh
      - supabase/tests/s0_f03_*
      - .github/workflows/s0-f03-pg17.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  f03-pg17-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      PRUMO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prumo_s0_test_cfi01
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PG client
        run: |
          python3 -m pip install 'psycopg[binary]>=3.2,<4'
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Create disposable test database
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE prumo_s0_test_cfi01'
      - name: Run existing S0 signed closure suite plus F03 PG17 fixtures
        run: bash scripts/run-s0-f03-pg17-local.sh
