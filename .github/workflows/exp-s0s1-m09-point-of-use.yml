name: S0 S1 M09 - transactional point of use laboratory
on:
  push:
    branches: [exp/s0s1-m09-point-of-use-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify isolated changes and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import subprocess,ast,pathlib
          base='4f6355a9ce70af50adc6b4c7a235bd17966fe097'
          got=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          required={'.github/workflows/exp-s0s1-m09-point-of-use.yml',
                    'integration/s0s1_m09_registry/pg17_use_check.sql',
                    'integration/s0s1_m09_registry/pg17_use_check.py',
                    'integration/s0s1_m09_registry/test_pg17_use_check.py'}
          optional={'docs/contratos/s0s1_meta_registry/M09_08_POINT_OF_USE_CONTROL_LAB.md'}
          assert required<=got and got<=required|optional,sorted(got^required)
          for name in ('pg17_use_check.py','test_pg17_use_check.py'):
              ast.parse((pathlib.Path('integration/s0s1_m09_registry')/name).read_text())
          print('M09-08 scope PASS')
          PY
      - name: Synthetic M09-01 regression
        run: python3 -B -m unittest integration.s0s1_m09_registry.test_port -v
  physical:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      M09_PG17_DISPOSABLE: 'YES'
      M09_PINNED_SOURCE: ${{ github.workspace }}/_m09_pin
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 01ffdb093013664b73b18d23f92aac2202578210
          path: _m09_pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check original S0 schema and dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _m09_pin rev-parse HEAD)" = 01ffdb093013664b73b18d23f92aac2202578210
          python3 -m pip install 'psycopg[binary]==3.2.13' 'cryptography==46.0.3'
      - name: Physical 18 point-of-use CAS and revocation cases
        run: python3 -B -m unittest integration.s0s1_m09_registry.test_pg17_use_check -v
      - name: M09-04 Ed25519 regression
        run: python3 -B -m unittest integration.s0s1_m09_registry.test_pg17_m2m -q
      - name: Confirm inherited source trees unchanged
        if: always()
        run: |
          test -z "$(git -C _m09_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
