name: S0 S1 M09 - registry snapshot laboratory
on:
  push:
    branches: [exp/s0s1-m09-snapshot-lab-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-m09-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact checkout and allowed delta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import subprocess
          base = 'af3c7a16f777eb0d9b37e96f5ac496f1afc03913'
          paths = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed = {
              'docs/contratos/s0s1_meta_registry/M09_EXECUCAO_DIRETA_20261031.md',
              'integration/s0s1_m09_registry/__init__.py',
              'integration/s0s1_m09_registry/port.py',
              'integration/s0s1_m09_registry/test_port.py',
              'integration/s0s1_m09_registry/snapshot.schema.json',
              '.github/workflows/exp-s0s1-m09-registry.yml',
          }
          if paths != allowed:
              raise SystemExit('M09 unauthorized delta: '+repr(sorted(paths ^ allowed)))
          print('M09 isolated branch delta PASS')
          PY
      - name: 32 adversarial lab cases
        run: python3 -B -m unittest discover -s integration/s0s1_m09_registry -t . -v
      - name: Optimized Python independent rerun
        run: python3 -O -B -m unittest discover -s integration/s0s1_m09_registry -t . -v
      - name: Compile syntax only without external services
        run: python3 -B -c "import ast,pathlib; p=pathlib.Path('integration/s0s1_m09_registry'); [ast.parse(f.read_text()) for f in p.glob('*.py')]; print('syntax PASS')"
