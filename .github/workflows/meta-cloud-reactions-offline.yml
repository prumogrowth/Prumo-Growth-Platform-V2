name: Meta Cloud inbound reactions - offline
on:
  push:
    branches: [feat/meta-cloud-reaction-handoff-20261027]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/meta-cloud-list-replies-20261027]
    paths:
      - 'integrations/whatsapp-meta/**'
      - '.github/workflows/meta-cloud-reactions-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reaction-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New synthetic reaction observations (16 focused)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            2>&1 | tee "$RUNNER_TEMP/meta-reaction.tap"
          grep -qx '# tests 16' "$RUNNER_TEMP/meta-reaction.tap"
          grep -qx '# pass 16' "$RUNNER_TEMP/meta-reaction.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-reaction.tap"
      - name: Previous Meta HMAC, button and list focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/meta-reaction-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-reaction-regressions.tap"
