name: S0 S1 OPS02 - offline untrusted evidence contract
on:
  push:
    branches: [exp/s0-s1-ops02-evidence-contract-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s0s1-ops02-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
jobs:
  offline-evidence-contract:
    if: github.ref == 'refs/heads/exp/s0-s1-ops02-evidence-contract-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exact checkout and certified checkpoint
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse a0c4eaf2720bd6cf2bd756544498f8f185f005fc^{tree})" = "977c4ed302b9dd14e459575abbbc718eaa8ca920"
          python3 -B -m integration.s0s1_ops02.scope | tee "$RUNNER_TEMP/ops02-scope-before.json"
      - name: Synthetic contracts and bounded input paths
        run: python3 -B -m unittest integration.s0s1_ops02.test_contract.ContractTests integration.s0s1_ops02.test_contract.PathTests -v 2>&1 | tee "$RUNNER_TEMP/ops02-contract.log"
      - name: Artificial Git adversarial tests
        run: python3 -B -m unittest integration.s0s1_ops02.test_contract.ScopeTests -v 2>&1 | tee "$RUNNER_TEMP/ops02-git.log"
      - name: Inspect absence of privileged verifier capabilities
        run: python3 -B -m unittest integration.s0s1_ops02.test_contract.CapabilityTests -v 2>&1 | tee "$RUNNER_TEMP/ops02-capabilities.log"
      - name: Complete suite under optimized Python
        run: python3 -B -O -m unittest integration.s0s1_ops02.test_contract -v 2>&1 | tee "$RUNNER_TEMP/ops02-optimized.log"
      - name: External delta and object inventory without importing candidate gate
        run: |
          python3 -B - <<'PY' | tee "$RUNNER_TEMP/ops02-independent-inventory.json"
          import hashlib, json, subprocess
          base = 'a0c4eaf2720bd6cf2bd756544498f8f185f005fc'
          expected = {
              'ops/s0s1_authority/contract_v1.json', 'ops/s0s1_authority/validate.py',
              'integration/s0s1_ops02/test_contract.py', 'integration/s0s1_ops02/scope.py',
              'docs/contratos/s0s1_ops02/CONTRATO_CANDIDATO.md',
              'docs/contratos/s0s1_ops02/RUNBOOK_CANDIDATO.md',
              'docs/contratos/s0s1_ops02/DECISOES_E_TESTES.json',
              '.github/workflows/exp-s0-s1-ops02-evidence-contract.yml'}
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args])
          def tree(ref):
              return {r.split(b'\t', 1)[1].decode(): r.split(b'\t', 1)[0].decode().split()
                      for r in git('ls-tree', '-rz', ref).split(b'\0') if r}
          before, after = tree(base), tree('HEAD')
          changed = {p for p in set(before) | set(after) if before.get(p) != after.get(p)}
          if changed != expected or any(p in before for p in expected):
              raise SystemExit('independent delta rejected')
          if git('rev-list', '--parents', base + '..HEAD').decode().splitlines() != [git('rev-parse', 'HEAD').decode().strip() + ' ' + base]:
              raise SystemExit('independent atomic history rejected')
          files = {}
          for path in sorted(expected):
              mode, kind, blob = after[path]
              if (mode, kind) != ('100644', 'blob'):
                  raise SystemExit('independent mode rejected')
              data = git('cat-file', 'blob', blob)
              files[path] = {'mode': mode, 'git_blob': blob, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          print(json.dumps({'base': base, 'base_tree': git('rev-parse', base+'^{tree}').decode().strip(), 'commit': git('rev-parse', 'HEAD').decode().strip(), 'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'status': 'PASS', 'inherited_tree_unchanged': True, 'files': files}, sort_keys=True))
          PY
      - name: Scope and clean checkout after all tests
        if: always()
        run: python3 -B -m integration.s0s1_ops02.scope | tee "$RUNNER_TEMP/ops02-scope-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: s0s1-ops02-offline-evidence
          path: ${{ runner.temp }}/ops02-*
          if-no-files-found: error
          retention-days: 14
