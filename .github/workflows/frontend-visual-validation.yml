name: LiberaCred - Validacao do frontend visual
on:
  push:
    branches:
      - feat/frontend-plataforma-visual
    paths:
      - "frontend/visual/**"
      - "frontend/preview/**"
      - ".github/workflows/frontend-visual-validation.yml"
permissions:
  contents: read
concurrency:
  group: fv-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-checkout:
    if: github.ref == 'refs/heads/feat/frontend-plataforma-visual'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout oficial, historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight Git e inventario antes de baixar o Chromium
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PYFAST'
          import importlib.util, os
          from pathlib import Path
          path = Path('frontend/visual/tests/run_acceptance.py')
          spec = importlib.util.spec_from_file_location('fv_native_preflight', path)
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)
          expected = os.environ['GITHUB_SHA']
          revision = validator.check_git_revision(expected)
          if not revision.get('passed'):
              raise SystemExit(f'Revisao Git divergente: {revision}')
          result = validator.check_native_blob_manifest(expected, True)
          if not result.get('passed'):
              raise SystemExit(f'Inventario ou hash divergente: {result}')
          print('Preflight nativo PASS:', result['files_checked'], 'arquivos')
          PYFAST
          python -B -m unittest discover -s frontend/visual/tests -p test_offline_export.py
      - name: Instalar Chromium para Playwright
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Preflight Git, seguranca ZIP, Node e Chromium
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CI: 'true'
        run: |
          python -B frontend/visual/tests/run_acceptance.py \
            --expected-head "$GITHUB_SHA" \
            --json-report fv-native-validation/report.json
      - name: Gerar exportacao publica SOMENTE apos gate nativo completo
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s frontend/preview -p 'test_*.py'
          python -B frontend/preview/build_preview.py --output out/prumo-demo-visual.zip
      - name: Artefato ZIP visual para avaliacao (30 dias; SEM deploy)
        uses: actions/upload-artifact@v4
        with:
          name: prumo-demo-visual-zip
          path: out/prumo-demo-visual.zip
          if-no-files-found: error
          retention-days: 30
      - name: Registrar resumo tecnico
        if: always()
        run: |
          python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report_path = Path('fv-native-validation/report.json')
          output = Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = ['## Validacao do frontend visual', '', 'Somente dados sinteticos; nenhum deploy ou envio.', '']
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              lines += ['Aceite nativo: **'+('PASS' if report.get('full_acceptance') else 'NAO APROVADO')+'**', '']
              for step in report.get('steps', []):
                  lines.append('- '+('PASS' if step.get('passed') and step.get('executed') else 'FALHA/BLOQUEADO')+': '+step.get('name','etapa desconhecida'))
          else:
              lines += ['O validador nao gerou relatorio: **NAO APROVADO**. Consulte o log.']
          output.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PYREPORT
      - name: Artefato JSON de diagnostico (1 dia)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fv-native-validation-${{ github.run_id }}
          path: fv-native-validation/report.json
          if-no-files-found: warn
          retention-days: 1
