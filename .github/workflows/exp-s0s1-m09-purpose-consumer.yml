name: S0 S1 M09 - single purpose offline Meta lab
on:
  push:
    branches: [exp/s0s1-m09-purpose-consumer-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  purpose-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 745f54acd8255bea728c5ab7c87848d5018ad66b
          path: _meta_pin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate exact isolated delta, pinned source and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _meta_pin rev-parse HEAD)" = 745f54acd8255bea728c5ab7c87848d5018ad66b
          python3 -B - <<'PY'
          import ast,subprocess
          from pathlib import Path
          base='184753988addcc4c4df6a5a05ec688b8310438d3'
          found=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          required={
              '.github/workflows/exp-s0s1-m09-purpose-consumer.yml',
              'integration/s0s1_m09_registry/purpose_slot_consumer.ts',
              'integration/s0s1_m09_registry/test_purpose_slot_consumer.mjs',
              'integration/s0s1_m09_registry/emit_purpose_slot_evidence.py'}
          optional={
              'docs/contratos/s0s1_meta_registry/M09_06_PURPOSE_CONSUMER_LAB.md'}
          assert required<=found and found<=required|optional,sorted(found^required)
          ast.parse(Path('integration/s0s1_m09_registry/emit_purpose_slot_evidence.py').read_text())
          print('M09-06 exact scope PASS')
          PY
      - name: Run offline M09-06 scope and purpose guards
        run: node --experimental-strip-types --test integration/s0s1_m09_registry/test_purpose_slot_consumer.mjs
      - name: Verify original WA04A and WA09 sources regressions
        run: |
          node --experimental-strip-types --test \
            _meta_pin/integrations/whatsapp-meta/credential-routing.test.ts \
            _meta_pin/integrations/whatsapp-meta/wa09-asset-onboarding-audit.test.ts
      - name: No original source modifications
        if: always()
        run: |
          test -z "$(git -C _meta_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"

  purpose-pg17-physical:
    needs: purpose-offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      M09_PINNED_SOURCE: ${{ github.workspace }}/_m09_pin
      M09_PG17_DISPOSABLE: 'YES'
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 01ffdb093013664b73b18d23f92aac2202578210
          path: _m09_pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify isolated PG17 pin and frozen dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _m09_pin rev-parse HEAD)" = 01ffdb093013664b73b18d23f92aac2202578210
          python3 -m pip install 'psycopg[binary]==3.2.13' 'cryptography==46.0.3'
      - name: Assign temporary witness path only inside runner
        run: echo "M09_PURPOSE_EVIDENCE=$RUNNER_TEMP/m09-purpose-lab.json" >> "$GITHUB_ENV"
      - name: Read exactly one slot via disposable installer after Ed25519 signed PG17 read
        run: python3 -B -m integration.s0s1_m09_registry.emit_purpose_slot_evidence
      - name: Consume signed PG17 evidence and reject mixed purposes
        run: node --experimental-strip-types --test integration/s0s1_m09_registry/test_purpose_slot_consumer.mjs
      - name: PG17 prior Ed25519 anti-replay regression
        run: python3 -B -m unittest integration.s0s1_m09_registry.test_pg17_m2m -q
      - name: Remove short-lived lab evidence and audit pinned trees
        if: always()
        run: |
          if test -n "$M09_PURPOSE_EVIDENCE"; then rm -f "$M09_PURPOSE_EVIDENCE"; fi
          test -z "$(git -C _m09_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
