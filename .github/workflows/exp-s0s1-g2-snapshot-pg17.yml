name: S0 G2 PG17 snapshot consistency and versioned Meta M18 contract
on:
  push:
    branches: [exp/s0s1-g2-snapshot-contract-pg17-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-and-pinned-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NODE_OPTIONS: --experimental-strip-types
      M18_META_PIN: ${{ github.workspace }}/_meta_pin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          path: _meta_pin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact additive scope and immutable pinned Meta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _meta_pin rev-parse HEAD)" = 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          python3 -B - <<'PY'
          import ast,pathlib,subprocess,json
          base='fb06741b16eee9f9709acaed412daf5ea73a6d19'
          got=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          needed={'.github/workflows/exp-s0s1-g2-snapshot-pg17.yml',
            'integration/s0s1_pd_g2/snapshot.py',
            'integration/s0s1_pd_g2/test_pg17_snapshot.py',
            'integration/s0s1_pd_g2/contract_manifest.json',
            'integration/s0s1_pd_g2/test_contract.mjs'}
          optional={'docs/contratos/s0_pre_dispatch/S0_G2_SNAPSHOT_CONTRACT_20261101.md'}
          assert needed<=got and got<=needed|optional,sorted(got)
          for name in ('snapshot.py','test_pg17_snapshot.py'):
           ast.parse((pathlib.Path('integration/s0s1_pd_g2')/name).read_text())
          json.loads(pathlib.Path('integration/s0s1_pd_g2/contract_manifest.json').read_text())
          print('G2 exact additive diff, syntax and JSON PASS')
          PY
      - name: Ten typed interfront version/authority contract tests
        run: node --test integration/s0s1_pd_g2/test_contract.mjs
      - name: Pinned Meta M18 62 original contract tests
        run: node --test _meta_pin/integrations/whatsapp-meta/wa18-dispatch-boundary-offline.test.ts
      - name: Old S0-M18 v0.2 negative compatibility regressions
        run: node --test integration/s0s1_m18_v02/test_interop.mjs
      - name: Pins immutable
        if: always()
        run: test -z "$(git -C _meta_pin status --porcelain)"
  physical-pg17-snapshot:
    needs: manifest-and-pinned-consumers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      M09_PG17_DISPOSABLE: 'YES'
      M09_PINNED_SOURCE: ${{ github.workspace }}/_m09_pin
      M18_META_PIN: ${{ github.workspace }}/_meta_pin
      M18_V02_PG17_FIXTURE: /tmp/s0_g2_pg17_statuses.json
      NODE_OPTIONS: --experimental-strip-types
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 01ffdb093013664b73b18d23f92aac2202578210
          path: _m09_pin
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          path: _meta_pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify source pins and install disposable dependencies
        run: |
          test "$(git -C _m09_pin rev-parse HEAD)" = 01ffdb093013664b73b18d23f92aac2202578210
          test "$(git -C _meta_pin rev-parse HEAD)" = 2a535ceb543418a76bb753a368eabc45bdbe4b0f
          python3 -m pip install 'psycopg[binary]==3.2.13' 'cryptography==46.0.3'
      - name: G2 twelve PG17 snapshot and interleaving tests
        run: python3 -B -m unittest integration.s0s1_pd_g2.test_pg17_snapshot -v
      - name: G1 physical audit fixes and PRE_DISPATCH regressions
        run: |
          python3 -B -m unittest integration.s0s1_pre_dispatch_v02.test_audit_fixes -q
          python3 -B -m unittest integration.s0s1_pre_dispatch_v02.test_pg17_service -q
          python3 -B -m unittest integration.s0s1_pre_dispatch.test_pg17_service -q
          python3 -B -m unittest integration.s0s1_m09_registry.test_pg17_use_check -q
      - name: Preserve Meta M18 no authority with physically emitted v0.2 status
        run: |
          python3 -B -m integration.s0s1_m18_v02.emit_pg17_evidence
          node --test integration/s0s1_m18_v02/test_interop.mjs
      - name: Remove temporary evidence; assert immutable source
        if: always()
        run: |
          rm -f /tmp/s0_g2_pg17_statuses.json
          test -z "$(git -C _m09_pin status --porcelain)"
          test -z "$(git -C _meta_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
