name: WA39 S0-Meta forensic bridge - PostgreSQL 17 offline
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/s0-fundacao-prumo]
    paths:
      - 'supabase/**'
      - 'scripts/run-s0-local.sh'
      - '.github/workflows/wa39-s0-meta-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa39-s0-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s0-meta-forensic-local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      PRUMO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prumo_s0_test_ci
    steps:
      - uses: actions/checkout@v4
      - name: Cliente PG17 e banco descartável
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE prumo_s0_test_ci'
      - name: Regressão completa S0 incluindo WA39 local
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s backend/tests -v
          bash scripts/run-s0-local.sh 2>&1 | tee "$RUNNER_TEMP/wa39.log"
          for n in {01..18}; do
            count="$(grep -c "WA39-$n PASS" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA39-$n marker invalid: $count" >&2; exit 1; fi
          done
          for n in {01..25}; do
            count="$(grep -c "WA40-$n PASS" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA40-$n marker invalid: $count" >&2; exit 1; fi
          done
          for n in {01..16}; do
            count="$(grep -c "WA41-$n PASS" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA41-$n marker invalid: $count" >&2; exit 1; fi
          done
          for n in {01..12}; do
            count="$(grep -c "WA42-$n PASS" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA42-$n marker invalid: $count" >&2; exit 1; fi
          done
          for n in {01..11}; do
            count="$(grep -c "WA42-R$n PASS" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA42-R$n marker invalid: $count" >&2; exit 1; fi
          done
          for n in {01..18}; do
            count="$(grep -c "WA43-$n PASS" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA43-$n marker invalid: $count" >&2; exit 1; fi
          done
          for n in {01..27}; do
            count="$(grep -c "^# WA44-$n PASS$" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA44-$n marker invalid: $count" >&2; exit 1; fi
          done
          for n in {01..27}; do
            count="$(grep -c "^# WA45-$n PASS$" "$RUNNER_TEMP/wa39.log" || true)"
            if [[ "$count" != 1 ]]; then echo "WA45-$n marker invalid: $count" >&2; exit 1; fi
          done
          echo "WA39 18/18, WA40 25/25, WA41 16/16, WA42 23/23, WA43 18/18, WA44 27/27, WA45 27/27 PASS - PG17 disposable"
