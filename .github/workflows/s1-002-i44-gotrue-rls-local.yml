name: Prumo S1-002 - I44 GoTrue PostgREST RLS real
on:
  push:
    branches: [feat/s1-002-equipe-prumo]
    paths:
      - '.github/workflows/s1-002-i44-gotrue-rls-local.yml'
      - 'scripts/test_s1_002_i44_real_auth_rls.py'
      - 'supabase/tests/s1_064_gotrue_rls_setup_local_only.sql'
      - 'supabase/tests/s1_061_proto_rls_equipe_local_only.sql'
      - 'supabase/tests/s1_062_proto_rls_excecao_local_only.sql'
      - 'supabase/tests/s1_063_proto_rls_unificada_local_only.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prumo-s1-002-i44-real-auth-rls
  cancel-in-progress: true
jobs:
  i44-go-true-postgrest-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      PRUMO_S1_I44_EPHEMERAL: 'YES'
      SUPABASE_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Instalar CLI Supabase pinada
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Instalar psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Criar GoTrue/PostgREST locais descartaveis
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          printf '%s\n' "$workdir" > "$RUNNER_TEMP/prumo-s1-i44-workdir"
          cd "$workdir"
          supabase init
          supabase start --exclude studio,realtime,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/prumo-s1-i44-env"
          test -s "$RUNNER_TEMP/prumo-s1-i44-env"
      - name: Testar GoTrue JWT e RLS conjunta I43 pelo PostgREST real
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/prumo-s1-i44-env"
          set +a
          python3 scripts/test_s1_002_i44_real_auth_rls.py
      - name: Remover stack local
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/prumo-s1-i44-workdir" ]; then
            cd "$(cat "$RUNNER_TEMP/prumo-s1-i44-workdir")"
            supabase stop || true
          fi
