name: OAI OFF17 independent S0 candidate contract review
on:
  push:
    branches:
      - test/oai-off17-s0-f02-version-audit-20261101
permissions:
  contents: read
concurrency:
  group: oai-off17-f02-pinned-audit
  cancel-in-progress: false
jobs:
  source-contract-and-inherited-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout own OpenAI audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact OFF16 base and isolated review-only delta
        shell: bash
        run: |
          set -euo pipefail
          base=1da934899099b0ccd705739a8c384dd046e981a9
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base" HEAD | sort > /tmp/changed-off17
          cat > /tmp/expected-off17 <<'EOF'
          .github/workflows/oai-off17-s0-f02-contract-review.yml
          docs/integracoes/openai/OAI_OFF17_REVISAO_CONTRATOS_S0_F01_F02_2026_11_01.md
          docs/integracoes/openai/OAI_ROTEIRO_PROGRESSO_2026_11_01.md
          docs/integracoes/openai/e04_offline_lab/tests/off17_s0_f02_pinned_source_review.py
          EOF
          diff -u /tmp/expected-off17 /tmp/changed-off17
          test -z "$(git diff --name-only "$base" HEAD -- backend/ integration/ integrations/ frontend/ supabase/)"
      - name: Setup Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify inherited cumulative OpenAI regression
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix docs/integracoes/openai/e04_offline_lab test | tee /tmp/off17-node.tap
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('/tmp/off17-node.tap','utf8');
          const val=k=>{const m=s.match(new RegExp('# '+k+' (\\d+)'));return m?Number(m[1]):null;};
          const facts={tests:val('tests'),pass:val('pass'),fail:val('fail'),skipped:val('skipped')};
          console.log(JSON.stringify({suite:'OAI_OFF17_NODE_INHERITED',...facts}));
          if(facts.tests!==950||facts.pass!==950||facts.fail!==0||facts.skipped!==0)process.exit(2);
          NODE
      - name: Load ONLY exact published S0 F02 source at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          pinned=5b619c7779fb8b6595c72da696a4aa7faec128d1
          git cat-file -e "$pinned^{commit}"
          git show "$pinned:integration/s0s1_f02/pg17_service.py" > /tmp/off17-pinned-s0-f02.py
          python3 - <<'PY'
          import ast,hashlib
          from pathlib import Path
          p=Path('/tmp/off17-pinned-s0-f02.py')
          tree=ast.parse(p.read_text())
          assert sum(isinstance(n,ast.FunctionDef) and n.name=='_sources' for n in tree.body)==1
          print('S0_F02_SOURCE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Test 20 reproducible source-level constraints, no PG17
        shell: bash
        env:
          S0_F02_PINNED_SOURCE: /tmp/off17-pinned-s0-f02.py
        run: |
          set -euo pipefail
          python3 docs/integracoes/openai/e04_offline_lab/tests/off17_s0_f02_pinned_source_review.py -v 2>&1 | tee /tmp/off17-python.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('/tmp/off17-python.log').read_text()
          matches=re.findall(r'Ran (\d+) tests? in',raw)
          assert len(matches)==1 and matches[0]=='20',matches
          assert re.search(r'(?m)^OK\s*$',raw),raw[-800:]
          assert not re.search(r'(?m)^FAILED ',raw)
          print('OFF17_SOURCE_AUDIT_PYTHON=20_PASS__NO_DB')
          PY
      - name: Scope and authority reminder
        if: always()
        run: |
          echo 'This checks exact published source via AST with synthetic cursor. NOT PG17 or hosted S0, no acceptance.'
          echo 'No changes to S0 source, no model key, no API calls, no Graph, no merge, no deploy.'
