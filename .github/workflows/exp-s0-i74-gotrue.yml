name: I74 provision real GoTrue full regression
on:
  push:
    branches: [exp/s0-i74-provisionamento-20261026]
    paths:
      - 'supabase/tests/s1_108_export_signed_executor_local_only.sql'
      - 'scripts/test_s0_i74_*'
      - 'scripts/test_s1_002_i74_signed_export_e2e.py'
      - '.github/workflows/exp-s0-i74-*'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: exp-s0-i74-real-gotrue
  cancel-in-progress: true
jobs:
  http-policy-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checar 138 testes unitarios incluindo novo intake assinado
        run: |
          PYTHONPATH=. python3 -m compileall -q backend/s1_gateway_fila_canonical_local.py scripts/test_s1_002_i55_signed_queue_e2e.py tests/test_s1_002_i55_queue_gateway.py backend/s1_gateway_intake_canonical_local.py scripts/test_s1_002_i53_signed_canonical_e2e.py tests/test_s1_002_i53_canonical_gateway.py backend/s1_gateway_http_policy_local.py backend/s1_signer_process_local.py backend/s1_signer_independent_gotrue_local.py backend/s1_signer_mtls_local.py backend/s1_i27_ephemeral_certificates.py backend/s1_i28_rotating_certificates.py backend/s1_signer_mtls_rotation_local.py tests/test_s1_002_i23_http_policy.py tests/test_s1_002_i25_signer_process.py tests/test_s1_002_i26_independent_auth.py tests/test_s1_002_i27_mtls.py tests/test_s1_002_i28_cert_lifecycle.py tests/test_s1_002_i29_persistent_revocation.py backend/s1_i29_persistent_certificate_store.py backend/s1_signer_mtls_persistent_local.py backend/s1_i30_signed_revocation_authority_local.py backend/s1_signer_mtls_authority_local.py tests/test_s1_002_i30_authenticated_authority.py backend/s1_i31_monotonic_witness_local.py backend/s1_i31_witness_authority_local.py tests/test_s1_002_i31_monotonic_witness.py scripts/test_s1_002_i37_intake_e2e_local.py backend/s1_gateway_intake_signed_local.py tests/test_s1_002_i37_intake_gateway.py
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i23_http_policy.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i25_signer_process.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i26_independent_auth.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i27_mtls.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i28_cert_lifecycle.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i29_persistent_revocation.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i30_authenticated_authority.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i31_monotonic_witness.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i37_intake_gateway.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i53_canonical_gateway.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i55_queue_gateway.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i62_excecao_gateway.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i67_command_parser.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i73_export_boundary.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_s1_002_i74_export_signed.py' -v
  e2e-gerencia-local:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CI: 'true'
      PRUMO_S1_I37_EPHEMERAL: 'YES'
      SUPABASE_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Cliente PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Instalar driver SQL pinado para gateway efemero
        run: python3 -m pip install --user 'psycopg[binary]==3.2.13'
      - name: Subir GoTrue e PostgREST completamente descartaveis
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          printf '%s\n' "$workdir" > "$RUNNER_TEMP/prumo-s1-i31-workdir"
          cd "$workdir"
          supabase init
          supabase start --exclude studio,realtime,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/prumo-s1-i31-env"
          test -s "$RUNNER_TEMP/prumo-s1-i31-env"
      - name: Testar intake-only GoTrue com HMAC, CAS, nonce e PostgreSQL descartavel
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/prumo-s1-i31-env"
          set +a
          PYTHONPATH=. python3 scripts/test_s1_002_i37_intake_e2e_local.py
      - name: Desligar stack local
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/prumo-s1-i31-workdir" ]; then
            cd "$(cat "$RUNNER_TEMP/prumo-s1-i31-workdir")"
            supabase stop || true
          fi
