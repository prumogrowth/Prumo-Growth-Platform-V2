name: S0 CFI01 - consolidated restricted backend
on:
  push:
    branches: [exp/s0-cfi01-principal-restrito-20261026]
    paths:
      - 'backend/**'
      - 'supabase/tests/s0_cfi01_*'
      - 'scripts/test_s0_cfi01_auth_rest_local.py'
      - 'integration/cfi01/**'
      - '.github/workflows/exp-s0-cfi01-restricted-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s0-cfi01-consolidated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-gotrue-restricted-backend:
    if: github.ref == 'refs/heads/exp/s0-cfi01-principal-restrito-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_DISABLE_TELEMETRY: '1'
      PRUMO_CFI01_TRANSACTIONAL_TEST: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current S0 and consolidated runtime tests, including pinned cross-front compatibility
        run: python3 -m unittest discover -s backend/tests -v
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Verify CLI and install fixed SQL driver
        run: |
          supabase --version
          supabase start --help > /dev/null
          supabase status --help > /dev/null
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          python3 -m pip install -r backend/requirements-s0-local.txt
      - name: Start unlinked disposable PostgreSQL17 GoTrue PostgREST
        run: supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Existing real Auth REST and RLS regression
        run: PYTHONPATH=. python3 scripts/test_s0_auth_rest_local.py
      - name: Existing real CFI01 regression using consolidated hardened SQL
        run: PYTHONPATH=. python3 scripts/test_s0_cfi01_auth_rest_local.py
      - name: All 14 checkpoint scenarios plus restricted backend audit and revocation scenarios
        run: PYTHONPATH=. python3 integration/cfi01/test_restricted_backend.py
      - name: Remove only disposable stack after success or failure
        if: always()
        run: supabase stop --no-backup
