name: Meta Cloud quoted reply context - offline
on:
  push:
    branches: [feat/meta-cloud-quoted-context-20261028]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [audit/meta-cloud-convergence-20261028-v1]
    paths:
      - 'integrations/whatsapp-meta/**'
      - '.github/workflows/meta-cloud-quoted-context-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quoted-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New signed quoted context tests (22)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-quoted-context-handoff.test.ts \
            2>&1 | tee "$RUNNER_TEMP/quoted-context-new.tap"
          grep -qx '# tests 22' "$RUNNER_TEMP/quoted-context-new.tap"
          grep -qx '# pass 22' "$RUNNER_TEMP/quoted-context-new.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/quoted-context-new.tap"
      - name: Convergence, identity and earlier signed webhook regressions (226)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-convergence-scope.test.ts \
            integrations/whatsapp-meta/cloud-composed-identity-guard.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-audit.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-handoff.test.ts \
            integrations/whatsapp-meta/cloud-failed-status-errors-handoff.test.ts \
            integrations/whatsapp-meta/cloud-unsupported-inbound-handoff.test.ts \
            integrations/whatsapp-meta/cloud-media-metadata-handoff.test.ts \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/quoted-context-regressions.tap"
          grep -qx '# tests 226' "$RUNNER_TEMP/quoted-context-regressions.tap"
          grep -qx '# pass 226' "$RUNNER_TEMP/quoted-context-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/quoted-context-regressions.tap"
