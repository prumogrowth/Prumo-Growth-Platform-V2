name: Prumo S0 - PostgreSQL isolado
on:
  push:
    branches: [feat/s0-fundacao-prumo]
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/s0-postgres.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/s0-postgres.yml'
  workflow_dispatch:

jobs:
  s0-db-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      PRUMO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prumo_s0_test_ci
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL quando ausente
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Criar banco de testes descartável
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE prumo_s0_test_ci'
      - name: Testar migrations e isolamento de concessionárias
        run: bash scripts/run-s0-local.sh
