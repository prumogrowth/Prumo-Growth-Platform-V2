name: Prumo S0 — Supabase Auth + REST local
on:
  pull_request:
    types: [labeled]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/test_s0_auth_rest_local.py'
      - 'backend/**'
      - '.github/workflows/s0-auth-rest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prumo-s0-auth-rest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-rest-local:
    # expensive local Supabase starts only after deliberate PR label
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-auth-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Supabase CLI (versao fixada)
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Validar opções disponíveis antes de executar
        run: |
          supabase --version
          supabase start --help > /dev/null
          supabase status --help > /dev/null
      - name: Iniciar Supabase EFÊMERO (não vincular ao projeto remoto)
        run: supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Preparar cliente PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Instalar driver de teste fixado e somente para sandbox
        run: python3 -m pip install -r backend/requirements-s0-local.txt
      - name: Testar GoTrue real e RLS pela Data API (dados fictícios)
        run: python3 scripts/test_s0_auth_rest_local.py
      - name: Finalizar instância efêmera
        if: always()
        run: supabase stop --no-backup || true
