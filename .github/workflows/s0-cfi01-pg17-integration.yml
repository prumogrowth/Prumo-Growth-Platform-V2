name: S0 CFI-01 - PG17 isolated closure integration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/s0-fundacao-prumo]
    paths:
      - 'backend/s0_human*'
      - 'backend/s0_s1_closure_authority_local.py'
      - 'backend/tests/test_s0_*'
      - 'scripts/run-s0-cfi01-pg17-local.sh'
      - 'supabase/tests/s0_cfi01_human_closure_table_local_only.sql'
      - '.github/workflows/s0-cfi01-pg17-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-closure-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      PRUMO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prumo_s0_test_cfi01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python PG17 driver and psql client
        run: |
          python3 -m pip install 'psycopg[binary]>=3.2,<4'
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Create disposable local integration database
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE prumo_s0_test_cfi01'
      - name: Synthetic S0/S1 unit regressions
        run: python3 -m unittest discover -s backend/tests -p 'test_s0_*.py' -v
      - name: Execute physical S0/S1 schema and closure integration
        run: bash scripts/run-s0-cfi01-pg17-local.sh
