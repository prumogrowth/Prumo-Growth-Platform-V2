name: S0 S1 M09 - WA04A WA09 pinned offline compatibility
on:
  push:
    branches: [exp/s0s1-m09-meta-bridge-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-meta-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      M09_META_PIN: ${{ github.workspace }}/_meta_pin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 745f54acd8255bea728c5ab7c87848d5018ad66b
          path: _meta_pin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact S0 candidate and independently pinned Meta source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _meta_pin rev-parse HEAD)" = 745f54acd8255bea728c5ab7c87848d5018ad66b
          test "$(git -C _meta_pin rev-parse HEAD:integrations/whatsapp-meta/credential-routing.ts)" = 2f817ef4e8e047e852867e4c30dd083769e32389
          test "$(git -C _meta_pin rev-parse HEAD:integrations/whatsapp-meta/wa09-asset-onboarding-audit.ts)" = 1622ca8fa56f37a57203ed84fd5e0eaa524a49a6
          python3 -B - <<'PY'
          import subprocess
          base='b128e662409dc876a9bd728c72e524d1e1baed08'
          allowed={'.github/workflows/exp-s0s1-m09-meta-bridge.yml',
            'integration/s0s1_m09_registry/wa04a_scope_bridge.ts',
            'integration/s0s1_m09_registry/test_wa04a_scope_bridge.mjs',
            'integration/s0s1_m09_registry/emit_wa04a_bridge_evidence.py',
            'docs/contratos/s0s1_meta_registry/M09_05_WA04A_BRIDGE_LAB.md'}
          diff=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],
                                           text=True).splitlines())
          assert diff <= allowed and diff >= allowed-{
            'docs/contratos/s0s1_meta_registry/M09_05_WA04A_BRIDGE_LAB.md'
          },sorted(diff^allowed)
          print('S0 independent source scope and pinned Meta exact blobs PASS')
          PY
      - name: M09-05 offline audit tests against original WA04A and WA09 modules
        run: node --experimental-strip-types --test integration/s0s1_m09_registry/test_wa04a_scope_bridge.mjs
      - name: Original WA04A and WA09 Meta regressions (no changes to their source)
        run: |
          node --experimental-strip-types --test \
            _meta_pin/integrations/whatsapp-meta/credential-routing.test.ts \
            _meta_pin/integrations/whatsapp-meta/wa09-asset-onboarding-audit.test.ts
      - name: Confirm Meta checkout unchanged
        if: always()
        run: |
          test -z "$(git -C _meta_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"

  pg17-signed-consumer:
    needs: pinned-meta-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      M09_META_PIN: ${{ github.workspace }}/_meta_pin
      M09_PINNED_SOURCE: ${{ github.workspace }}/_m09_pin
      M09_PG17_DISPOSABLE: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 01ffdb093013664b73b18d23f92aac2202578210
          path: _m09_pin
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 745f54acd8255bea728c5ab7c87848d5018ad66b
          path: _meta_pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact checkout source and install pinned physical dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C _m09_pin rev-parse HEAD)" = 01ffdb093013664b73b18d23f92aac2202578210
          test "$(git -C _meta_pin rev-parse HEAD)" = 745f54acd8255bea728c5ab7c87848d5018ad66b
          python3 -m pip install 'psycopg[binary]==3.2.13' 'cryptography==46.0.3'
      - name: Set temporary evidence path for same isolated runner
        run: echo "M09_BRIDGE_EVIDENCE=$RUNNER_TEMP/s0s1-m09-bridge-response.json" >> "$GITHUB_ENV"
      - name: Generate Ed25519 verified physical PG17 read in disposable DB
        run: python3 -B -m integration.s0s1_m09_registry.emit_wa04a_bridge_evidence
      - name: Consume exact physical read via TypeScript bridge and pinned Meta
        run: node --experimental-strip-types --test integration/s0s1_m09_registry/test_wa04a_scope_bridge.mjs
      - name: Preserve pinned source repositories
        if: always()
        run: |
          test -z "$(git -C _meta_pin status --porcelain)"
          test -z "$(git -C _m09_pin status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
