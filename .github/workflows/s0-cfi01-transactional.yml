name: S0 CFI01 - real disposable GoTrue transactions
on:
  push:
    branches: [feat/s0-auditoria-nucleo-operacional-20261025]
    paths:
      - 'backend/s0_cfi01_communication_local.py'
      - 'backend/s0_communication_contract.py'
      - 'integration/cfi01/**'
      - '.github/workflows/s0-cfi01-transactional.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s0-cfi01-real-transactional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-gotrue-transactions:
    if: github.ref == 'refs/heads/feat/s0-auditoria-nucleo-operacional-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_DISABLE_TELEMETRY: '1'
      PRUMO_CFI01_TRANSACTIONAL_TEST: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned existing CFI01 runtime, without merging any branch
        uses: actions/checkout@v4
        with:
          ref: 948891714f632adb6179cf3a11f362a6eb914f91
          path: work/cfi01-runtime
          persist-credentials: false
      - name: Verify source SHA and overlay only the communication modules and new test
        run: |
          set -euo pipefail
          test "$(git -C work/cfi01-runtime rev-parse HEAD)" = 948891714f632adb6179cf3a11f362a6eb914f91
          cp backend/s0_communication_contract.py backend/s0_cfi01_communication_local.py work/cfi01-runtime/backend/
          cp integration/cfi01/test_transactional_communication.py work/cfi01-runtime/scripts/test_transactional_communication.py
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Verify installed CLI commands
        run: |
          supabase --version
          supabase start --help > /dev/null
          supabase status --help > /dev/null
      - name: SQL client and pinned original driver
        run: |
          set -euo pipefail
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          python3 -m pip install -r work/cfi01-runtime/backend/requirements-s0-local.txt
      - name: Start unlinked disposable PostgreSQL17 GoTrue PostgREST
        working-directory: work/cfi01-runtime
        run: supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Original real Auth REST regression
        working-directory: work/cfi01-runtime
        run: PYTHONPATH=. python3 scripts/test_s0_auth_rest_local.py
      - name: Original real CFI01 capture recheck regression
        working-directory: work/cfi01-runtime
        run: PYTHONPATH=. python3 scripts/test_s0_cfi01_auth_rest_local.py
      - name: New transactional communication scenarios, real identities and signed SQL
        working-directory: work/cfi01-runtime
        run: PYTHONPATH=. python3 scripts/test_transactional_communication.py
      - name: Remove only disposable stack, also after failed assertions
        if: always()
        working-directory: work/cfi01-runtime
        run: supabase stop --no-backup
