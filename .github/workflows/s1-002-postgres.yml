name: Prumo S1-002 - equipe Prumo PG17
on:
  push:
    branches: [feat/s1-002-equipe-prumo]
    paths:
      - 'supabase/**'
      - 'scripts/run-s1-002-local.sh'
      - 'scripts/run-s1-002-i12-local.sh'
      - 'scripts/run-s1-002-i52-local.sh'
      - 'scripts/test_s1_002_i67_legacy_consumer_inventory.py'
      - 'scripts/test_s1_002_i75_g3_surface_inventory.py'
      - 'tests/test_s1_002_i75_g3_inventory.py'
      - 'scripts/test_s1_002_i75c_pg17_effective_catalog.py'
      - 'tests/test_s1_002_i75c_pg17_effective_catalog.py'
      - 'backend/s1_gateway_*.py'
      - 'backend/s1_signer_*.py'
      - 'backend/s1_command_validation_local.py'
      - 'scripts/test_s1_002_*.sh'
      - '.github/workflows/s1-002-postgres.yml'
      - 'scripts/test_s1_002_i77_g1_pr20_compatibility.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prumo-s1-002-pg
  cancel-in-progress: true
jobs:
  s1-002-equipe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      PRUMO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prumo_s0_test_s1ci
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL se necessario
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Criar base local descartavel
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE prumo_s0_test_s1ci'
      - name: Executar regressao S0 e gate equipe S1-002
        run: bash scripts/run-s1-002-i12-local.sh
      - name: I52 etapa canonica S0-S1 apos regressao historica
        run: bash scripts/run-s1-002-i52-local.sh
      - name: I46 inventario completo das migrations SQL rastreadas
        run: python3 scripts/test_s1_002_i46_acl_inventory.py
      - name: I46 catalogo ACL efetivo no PG17 descartavel
        run: psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_067_catalog_i46_local_only.sql
      - name: I75B inventario lexical de objetos G3, historico e referencias a midia
        run: |
          python3 -m unittest discover -s tests -p 'test_s1_002_i75_g3_inventory.py' -v
          python3 scripts/test_s1_002_i75_g3_surface_inventory.py
      - name: I75B preservar inventario G3 para revisao de objetos e colunas
        uses: actions/upload-artifact@v4
        with:
          name: s1-002-i75b-g3-inventory
          path: ${{ runner.temp }}/s1_002_i75b_g3_inventory.json
          retention-days: 14
      - name: I75C verificar catalogo efetivo PG17 e ACL por coluna
        run: |
          python3 -m unittest discover -s tests -p 'test_s1_002_i75c_pg17_effective_catalog.py' -v
          python3 scripts/test_s1_002_i75c_pg17_effective_catalog.py
      - name: I75C arquivar provas de catalogo PG17
        uses: actions/upload-artifact@v4
        with:
          name: s1-002-i75c-effective-g3-catalog
          path: ${{ runner.temp }}/s1_002_i75c_pg17_g3_effective_catalog.json
          retention-days: 14
      - name: I48 catalogo efetivo de roles e funcoes gateway S0
        run: psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" -f supabase/tests/s1_071_gateway_acl_catalog_local_only.sql
      - name: I48 cruzamento de fontes S0 013-037
        run: python3 scripts/test_s1_002_i48_acl_crosswalk.py
      - name: Arquivar cruzamento I48
        uses: actions/upload-artifact@v4
        with:
          name: s1-002-i48-crosswalk
          path: ${{ runner.temp }}/s1_002_i48_crosswalk.json
          retention-days: 14
      - name: Arquivar inventario estatico I46
        uses: actions/upload-artifact@v4
        with:
          name: s1-002-i46-acl-inventory
          path: ${{ runner.temp }}/s1_002_i46_acl_inventory.json
          retention-days: 14

  g1-pr20-compatibility:
    name: I77 G1 PR20 pinned reproduction on live S1 source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_DISABLE_TELEMETRY: '1'
      PRUMO_CFI01_TRANSACTIONAL_TEST: 'YES'
      PRUMO_HISTORY_DISPOSABLE_TEST: 'YES'
      PRUMO_F02_DISPOSABLE_TEST: 'YES'
      PRUMO_G1_DISPOSABLE_TEST: 'YES'
      PRUMO_G1_SOURCE_REPO: work-s1-sources
    steps:
      - name: Checkout S1 to own branch HEAD for fail-closed reconciliation
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact executable PR20 S0 code into isolated directory
        uses: actions/checkout@v4
        with:
          ref: d53c40a6ef55e82d2282c482b299cff1dbf990bd
          path: work-g1
          persist-credentials: false
      - name: Checkout current S1 SHA into G1 disposable source directory
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          path: work-g1/work-s1-sources
          persist-credentials: false
      - name: Reconcile all 34 pinned source hashes and ENCAMINHADO contract
        run: |
          python3 scripts/test_s1_002_i77_g1_pr20_compatibility.py \
            --g1 work-g1 --s1 work-g1/work-s1-sources --s1-sha "$GITHUB_SHA"
      - name: Preserve I77 reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: s1-002-i77-pr20-pinned-compatibility
          path: \${{ runner.temp }}/s1_i77_g1_pinned_compatibility.json
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck original S0 F02 + G1 units without changing S1 code
        working-directory: work-g1
        run: python3 -m unittest discover -s backend/tests -v
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Fixed dependencies for PR20 test harness
        working-directory: work-g1
        run: |
          supabase --version
          supabase start --help > /dev/null
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          python3 -m pip install -r backend/requirements-s0-local.txt
      - name: Start isolated disposable GoTrue and PostgreSQL 17 stack
        working-directory: work-g1
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Recheck existing S0 Auth REST and CFI regressions
        working-directory: work-g1
        run: |
          PYTHONPATH=. python3 scripts/test_s0_auth_rest_local.py
          PYTHONPATH=. python3 scripts/test_s0_cfi01_auth_rest_local.py
      - name: Verify historical session gates on disposable S0
        working-directory: work-g1
        run: PYTHONPATH=. python3 integration/history/test_session_history.py --profile s0
      - name: Recheck 32 CFI and 24 F02 tests
        working-directory: work-g1
        run: PYTHONPATH=. python3 integration/f02/test_authoritative_review.py
      - name: Reuse S1 current hashes in G1 disposable PG17
        working-directory: work-g1
        run: PYTHONPATH=. python3 integration/history/prepare_s1_profile.py --source-repo work-s1-sources --manifest integration/g1/s1_sources.json
      - name: Recheck I63 candidate history in same isolated DB
        working-directory: work-g1
        run: PYTHONPATH=. python3 integration/history/test_session_history.py --profile i63
      - name: Install guarded ENCAMINHADO G1 delta in disposable DB only
        working-directory: work-g1
        run: PYTHONPATH=. python3 integration/g1/install_local.py
      - name: Reproduce five original S1 SQL queue and exception acceptances
        working-directory: work-g1
        run: |
          for test in s1_078_fila_s0_canonica_aceite.sql s1_080_fila_reconciliacao_aceite.sql s1_081_atribuicao_grant_i57_aceite.sql s1_082_fila_gestor_autorizacao_aceite.sql s1_085_excecao_caso_canonica_aceite.sql; do
            PYTHONPATH=. python3 integration/g1/run_pinned_sql.py "work-s1-sources/supabase/tests/$test"
          done
      - name: Reproduce 36 real G1 manual handoff tests from PR20
        working-directory: work-g1
        run: PYTHONPATH=. python3 integration/g1/test_manual_handoff.py
      - name: Delete disposable stack on success or failure
        if: always()
        working-directory: work-g1
        run: supabase stop --no-backup
