name: Meta Cloud HTTP ACK trust-boundary audit - offline
on:
  push:
    branches: [audit/meta-cloud-http-ack-authority-20261028]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [audit/meta-physical-replay-receipt-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ack-perimeter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard against direct legacy shape-only ACK use in runtime code
        shell: bash
        run: |
          set -euo pipefail
          # The old helper is retained only as an explicitly isolated fixture.
          # Tests and forensic-only audit modules may reproduce its risk.
          # Runtime usage in server/frontend/worker paths must be reviewed,
          # not quietly upgraded to a production HTTP status.
          violations=0
          while IFS= read -r file; do
            case "$file" in
              integrations/whatsapp-meta/durable-receipt.ts|\
              integrations/whatsapp-meta/cloud-physical-replay-receipt-audit.ts|\
              integrations/whatsapp-meta/cloud-http-ack-authority-audit.ts|\
              *.test.ts|*.spec.ts|*.test.js|*.test.mjs)
                ;;
              *)
                echo "Forbidden direct ACK helper reference: $file" >&2
                violations=1
                ;;
            esac
          done < <(git grep -l -w 'decideBatchAck' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.py' || true)
          test "$violations" -eq 0
      - name: ACK trust boundary adversarial cases (30)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 integrations/whatsapp-meta/cloud-http-ack-authority-audit.test.ts 2>&1 | tee "$RUNNER_TEMP/ack-boundary-new.tap"
          grep -qx '# tests 30' "$RUNNER_TEMP/ack-boundary-new.tap"
          grep -qx '# pass 30' "$RUNNER_TEMP/ack-boundary-new.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/ack-boundary-new.tap"
      - name: Previously certified signed Cloud and S0 interface regressions (339)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-physical-replay-receipt-audit.test.ts \
            integrations/whatsapp-meta/cloud-batch-scope-preflight.test.ts \
            integrations/whatsapp-meta/meta-s0-readonly-cross-audit.test.ts \
            integrations/whatsapp-meta/s0-handoff-contract.test.ts \
            integrations/whatsapp-meta/cloud-quoted-context-handoff.test.ts \
            integrations/whatsapp-meta/cloud-convergence-scope.test.ts \
            integrations/whatsapp-meta/cloud-composed-identity-guard.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-audit.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-handoff.test.ts \
            integrations/whatsapp-meta/cloud-failed-status-errors-handoff.test.ts \
            integrations/whatsapp-meta/cloud-unsupported-inbound-handoff.test.ts \
            integrations/whatsapp-meta/cloud-media-metadata-handoff.test.ts \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/ack-boundary-regressions.tap"
          grep -qx '# tests 339' "$RUNNER_TEMP/ack-boundary-regressions.tap"
          grep -qx '# pass 339' "$RUNNER_TEMP/ack-boundary-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/ack-boundary-regressions.tap"
