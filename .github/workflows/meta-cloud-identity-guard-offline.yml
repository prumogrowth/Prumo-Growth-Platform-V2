name: Meta Cloud signed generic identity audit - offline
on:
  push:
    branches: [audit/meta-cloud-generic-identifier-guard-20261027]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [audit/meta-cloud-composed-cost-snapshot-20261027]
    paths:
      - 'integrations/whatsapp-meta/**'
      - '.github/workflows/meta-cloud-identity-guard-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-identity-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New adversarial signed generic identity cases (20)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-composed-identity-guard.test.ts \
            2>&1 | tee "$RUNNER_TEMP/meta-generic-identities.tap"
          grep -qx '# tests 20' "$RUNNER_TEMP/meta-generic-identities.tap"
          grep -qx '# pass 20' "$RUNNER_TEMP/meta-generic-identities.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-generic-identities.tap"
      - name: Snapshot audit and prior webhook regressions (194)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-composed-observation-audit.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-handoff.test.ts \
            integrations/whatsapp-meta/cloud-failed-status-errors-handoff.test.ts \
            integrations/whatsapp-meta/cloud-unsupported-inbound-handoff.test.ts \
            integrations/whatsapp-meta/cloud-media-metadata-handoff.test.ts \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/meta-generic-regressions.tap"
          grep -qx '# tests 194' "$RUNNER_TEMP/meta-generic-regressions.tap"
          grep -qx '# pass 194' "$RUNNER_TEMP/meta-generic-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-generic-regressions.tap"
