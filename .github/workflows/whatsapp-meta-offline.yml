name: Prumo Meta - regressao offline integral
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'integrations/whatsapp-meta/**'
      - '.github/workflows/whatsapp-meta-offline.yml'

permissions:
  contents: read

concurrency:
  group: prumo-meta-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node 22 para strip-types sem instalar pacotes do projeto
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate focado WA16 e WA17 Node (44 testes, sem rede)
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/s0-unknown-commit-recovery.test.ts \
            integrations/whatsapp-meta/template-catalog-control.test.ts \
            integrations/whatsapp-meta/template-mcp-multiformat.test.ts \
            2>&1 | tee "$RUNNER_TEMP/wa16_wa17.tap"
          grep -qx '# tests 44' "$RUNNER_TEMP/wa16_wa17.tap"
          grep -qx '# pass 44' "$RUNNER_TEMP/wa16_wa17.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/wa16_wa17.tap"
          echo 'PASS WA16/17: 44 tests in native Node 22 test runner'
      - name: Regressao WhatsApp/Meta completa, somente fixtures
        run: bash integrations/whatsapp-meta/run-offline-tests.sh --all

  wa06d-postgresql-17:
    name: WA-06D PG17 descartavel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Testar restricoes do runner WA-06D, sem SQL real
        run: |
          bash -n integrations/whatsapp-meta/lab/run-wa06d-ephemeral.sh
          python3 -m unittest discover -s integrations/whatsapp-meta/lab -p test_wa06d_ephemeral_runner.py -v
      - name: Criar PostgreSQL 17 descartavel em Docker, sem rede
        run: |
          set -euo pipefail
          docker run --detach --rm --name wa06d-fixture-pg17 \
            --network none \
            --env POSTGRES_USER=wa06d_owner \
            --env POSTGRES_DB=wa06d_test_ephemeral \
            --env POSTGRES_PASSWORD=ci_fixture_only \
            postgres:17 -c listen_addresses=''
          for i in {1..30}; do
            if docker logs wa06d-fixture-pg17 2>&1 | grep -q 'PostgreSQL init process complete; ready for start up' && \
              docker exec wa06d-fixture-pg17 pg_isready -U wa06d_owner -d wa06d_test_ephemeral >/dev/null 2>&1; then
              echo 'PASS WA06D: PostgreSQL 17 sandbox healthy (Unix socket only)'
              exit 0
            fi
            sleep 1
          done
          echo 'FAIL WA06D: disposable PostgreSQL did not start' >&2
          exit 1
      - name: Executar WA-06D 14 casos SQL + 6 casos pos-COMMIT
        run: |
          set -euo pipefail
          sql='integrations/whatsapp-meta/lab'
          docker exec --interactive wa06d-fixture-pg17 psql -X -qAt -v ON_ERROR_STOP=1 \
            -U wa06d_owner -d wa06d_test_ephemeral \
            < "$sql/wa06d_pg17_atomicity.sql" 2>&1 | tee "$RUNNER_TEMP/wa06d_atomicity.log"
          docker exec --interactive wa06d-fixture-pg17 psql -X -qAt -v ON_ERROR_STOP=1 \
            -U wa06d_owner -d wa06d_test_ephemeral \
            < "$sql/wa06d_pg17_postcommit_setup.sql" 2>&1 | tee "$RUNNER_TEMP/wa06d_postcommit_setup.log"
          docker exec --interactive wa06d-fixture-pg17 psql -X -qAt -v ON_ERROR_STOP=1 \
            -U wa06d_owner -d wa06d_test_ephemeral \
            < "$sql/wa06d_pg17_postcommit_verify.sql" 2>&1 | tee "$RUNNER_TEMP/wa06d_postcommit_verify.log"
          for n in {01..14}; do
            count="$(grep -cE "WA06D-$n PASS$" "$RUNNER_TEMP/wa06d_atomicity.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA06D-$n: missing/duplicated pass marker" >&2; exit 1; fi
          done
          for n in {01..06}; do
            count="$(grep -cE "WA06D-B$n PASS:" "$RUNNER_TEMP/wa06d_postcommit_verify.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA06D-B$n: missing/duplicated pass marker" >&2; exit 1; fi
          done
          echo 'PASS WA06D: all 20 SQL markers independently verified with 0 psql errors'
      - name: Parar e apagar PostgreSQL descartavel
        if: always()
        run: docker rm --force wa06d-fixture-pg17 >/dev/null 2>&1 || true

  wa15c-cross-branch-pg17:
    name: WA-15C contratos Meta TS + S0 PG17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      PRUMO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prumo_s0_test_ci
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - name: Checkout Meta PR Draft, sem merge em main
        uses: actions/checkout@v4
        with:
          path: meta
          persist-credentials: false
      - name: Checkout fonte S0 Draft isoladamente, sem merge entre PRs
        uses: actions/checkout@v4
        with:
          ref: feat/s0-fundacao-prumo
          path: s0
          persist-credentials: false
      - name: Node 22 sem npm install
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cliente PG e banco descartavel
        run: |
          set -euo pipefail
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE prumo_s0_test_ci'
      - name: Provar todas as migrations S0 no mesmo PG17
        run: bash s0/scripts/run-s0-local.sh
      - name: Gerar comandos parametrizados a partir do TypeScript Meta real
        run: |
          set -euo pipefail
          node --experimental-strip-types meta/integrations/whatsapp-meta/lab/wa15c-produce-s0-commands.ts > "$RUNNER_TEMP/wa15c_commands.json"
          python3 - "$RUNNER_TEMP/wa15c_commands.json" <<'PY'
          import json,sys
          commands=json.load(open(sys.argv[1],encoding='utf-8'))
          assert len(commands)==8
          assert len({x['label'] for x in commands})==8
          assert all(not x['ack_allowed'] and not x['retry_external'] and
            not x['production_authorized'] for x in commands)
          print('PASS WA15C-TS: 8 commands from live WA15B code; never ACK/retry')
          PY
      - name: Exercitar S0-042 com parametros TS e ler apos COMMIT em nova sessao
        run: |
          set -euo pipefail
          sql='meta/integrations/whatsapp-meta/lab'
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa15c_pg17_setup.sql"
          for phase in execute recover; do
            psql -X -v ON_ERROR_STOP=1 \
              -v "wa15_payload=$(cat "$RUNNER_TEMP/wa15c_commands.json")" \
              "$PRUMO_TEST_DATABASE_URL" \
              -f "$sql/wa15c_pg17_"$phase".sql" \
              2>&1 | tee "$RUNNER_TEMP/wa15c_"$phase".log"
          done
          for n in {01..09}; do
            count="$(grep -c "PASS WA15C-$n:" "$RUNNER_TEMP/wa15c_execute.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA15C-$n marker: $count" >&2; exit 1; fi
          done
          for n in {10..12}; do
            count="$(grep -c "PASS WA15C-$n:" "$RUNNER_TEMP/wa15c_recover.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA15C-$n marker: $count" >&2; exit 1; fi
          done
          echo 'PASS WA15C: 12 cross-branch PostgreSQL checks, three real psql sessions'

      - name: "WA-16B: commit response perdida e recuperacao em novas sessoes PG17"
        run: |
          set -euo pipefail
          sql='meta/integrations/whatsapp-meta/lab'
          node --experimental-strip-types "$sql/wa16-produce-unknown-commit-commands.ts" \
            > "$RUNNER_TEMP/wa16_commands.json"
          python3 - "$RUNNER_TEMP/wa16_commands.json" <<'PY'
          import json,sys
          cmds=json.load(open(sys.argv[1],encoding='utf-8'))
          assert len(cmds)==8 and len({x['label'] for x in cmds})==8
          assert all(x['ack_allowed'] is False and x['retry_external'] is False
                     and x['production_authorized'] is False for x in cmds)
          print('PASS WA16P-TS: 8 fail-closed commands from live WA15B adapter')
          PY
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa16_pg17_setup.sql"
          psql -X -v ON_ERROR_STOP=1 \
            -v "wa15_payload=$(cat "$RUNNER_TEMP/wa16_commands.json")" \
            "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa16_pg17_before_rollback.sql" \
            2>&1 | tee "$RUNNER_TEMP/wa16_before.log"
          # Intentionally DO NOT surface the completed COMMIT reply; capture
          # it privately and recover only through a separate read-only session.
          psql -X -v ON_ERROR_STOP=1 \
            -v "wa15_payload=$(cat "$RUNNER_TEMP/wa16_commands.json")" \
            "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa16_pg17_after_commit.sql" \
            > "$RUNNER_TEMP/wa16_hidden_commit.log" 2>&1
          psql -X -v ON_ERROR_STOP=1 \
            -v "wa15_payload=$(cat "$RUNNER_TEMP/wa16_commands.json")" \
            "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa16_pg17_recover_unknown.sql" \
            2>&1 | tee "$RUNNER_TEMP/wa16_recovery.log"
          for n in 01; do
            test "$(grep -c "PASS WA16P-$n:" "$RUNNER_TEMP/wa16_before.log" || true)" = 1
          done
          for n in 02 03 04; do
            test "$(grep -c "PASS WA16P-$n:" "$RUNNER_TEMP/wa16_hidden_commit.log" || true)" = 1
          done
          for n in 05 06 07 08 09 10 11; do
            test "$(grep -c "PASS WA16P-$n:" "$RUNNER_TEMP/wa16_recovery.log" || true)" = 1
          done
          psql -X -qAt -v ON_ERROR_STOP=1 \
            -v "wa15_payload=$(cat "$RUNNER_TEMP/wa16_commands.json")" \
            "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa16_pg17_read_recovery_json.sql" \
            > "$RUNNER_TEMP/wa16_recovery_db.json"
          node --experimental-strip-types "$sql/wa16-assert-db-recovery.ts" \
            < "$RUNNER_TEMP/wa16_recovery_db.json"
          echo 'PASS WA16B: 11 individual SQL checks + DB-to-TS classification, no Graph or ACK'

      - name: "WA-27: isolamento RLS de finalidades e revogacoes PG17"
        run: |
          set -euo pipefail
          sql='meta/integrations/whatsapp-meta/lab'
          psql -X -qAt -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa27_pg17_setup.sql" > "$RUNNER_TEMP/wa27_setup.log"
          grep -qx 'WA27-SETUP PASS' "$RUNNER_TEMP/wa27_setup.log"
          capture() {
            local stage="$1" role="$2"
            psql -X -qAt -v ON_ERROR_STOP=1 \
              -v "wa27_stage=$stage" -v "wa27_role=$role" \
              "$PRUMO_TEST_DATABASE_URL" -f "$sql/wa27_pg17_read.sql" \
              > "$RUNNER_TEMP/wa27_$stage.json"
            python3 - "$RUNNER_TEMP/wa27_$stage.json" <<'PY'
          import json,sys
          snap=json.load(open(sys.argv[1],encoding='utf-8'))
          assert isinstance(snap,dict) and snap['can_write'] is False
          assert snap['cross_tenant_scopes']==0
          PY
          }
          capture initial_a wa27_reader_shop_a
          capture initial_b wa27_reader_shop_b
          capture no_scope wa27_reader_shop_none
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa27_pg17_optout.sql" > /dev/null
          capture optout wa27_reader_shop_a
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa27_pg17_pause.sql" > /dev/null
          capture paused wa27_reader_shop_a
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa27_pg17_revoke_grant.sql" > /dev/null
          capture grant_revoked wa27_reader_shop_a
          psql -X -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa27_pg17_revoke_actor.sql" > /dev/null
          capture actor_revoked wa27_reader_shop_a
          capture after_b wa27_reader_shop_b
          node --experimental-strip-types "$sql/wa27-assert-pg17-ports.ts" \
            "$RUNNER_TEMP/wa27_initial_a.json" \
            "$RUNNER_TEMP/wa27_initial_b.json" \
            "$RUNNER_TEMP/wa27_no_scope.json" \
            "$RUNNER_TEMP/wa27_optout.json" \
            "$RUNNER_TEMP/wa27_paused.json" \
            "$RUNNER_TEMP/wa27_grant_revoked.json" \
            "$RUNNER_TEMP/wa27_actor_revoked.json" \
            "$RUNNER_TEMP/wa27_after_b.json" | tee "$RUNNER_TEMP/wa27_evidence.log"
          for n in {01..14}; do
            test "$(grep -cx "WA27-$n PASS" "$RUNNER_TEMP/wa27_evidence.log" || true)" = 1
          done
          echo 'PASS WA27: 14 PG17-to-TypeScript checks with role RLS and distinct COMMIT sessions'

      - name: "WA-28: reserva e revogacao concorrentes PG17 descartavel"
        run: |
          set -euo pipefail
          sql='meta/integrations/whatsapp-meta/lab'
          psql -X -qAt -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa28_pg17_atomic_reservation.sql" > "$RUNNER_TEMP/wa28_setup.log"
          grep -qx 'WA28-SETUP PASS' "$RUNNER_TEMP/wa28_setup.log"
          python3 "$sql/wa28-assert-concurrent-pg17.py" | tee "$RUNNER_TEMP/wa28_evidence.log"
          for n in {01..21}; do
            count="$(grep -cx "WA28-$n PASS" "$RUNNER_TEMP/wa28_evidence.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA28-$n marker: $count" >&2; exit 1; fi
          done
          echo 'PASS WA28: 21 assertions with two real PostgreSQL row-lock interleavings'

      - name: "WA-29: claim unico e revogacao concorrente PG17 descartavel"
        run: |
          set -euo pipefail
          sql='meta/integrations/whatsapp-meta/lab'
          psql -X -qAt -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa29_pg17_dispatch_claim.sql" > "$RUNNER_TEMP/wa29_setup.log"
          grep -qx 'WA29-SETUP PASS' "$RUNNER_TEMP/wa29_setup.log"
          python3 "$sql/wa29-assert-claim-races-pg17.py" | tee "$RUNNER_TEMP/wa29_evidence.log"
          for n in {01..23}; do
            count="$(grep -cx "WA29-$n PASS" "$RUNNER_TEMP/wa29_evidence.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA29-$n marker: $count" >&2; exit 1; fi
          done
          echo 'PASS WA29: 23 PG17 checks with 3 observed lock interleavings'

      - name: "WA-30: recuperacao sem retry de claim/evidencia incerta PG17"
        run: |
          set -euo pipefail
          sql='meta/integrations/whatsapp-meta/lab'
          psql -X -qAt -v ON_ERROR_STOP=1 "$PRUMO_TEST_DATABASE_URL" \
            -f "$sql/wa30_pg17_unknown_outcome.sql" > "$RUNNER_TEMP/wa30_setup.log"
          grep -qx 'WA30-SETUP PASS' "$RUNNER_TEMP/wa30_setup.log"
          python3 "$sql/wa30-assert-uncertain-pg17.py" | tee "$RUNNER_TEMP/wa30_evidence.log"
          for n in {01..27}; do
            count="$(grep -cx "WA30-$n PASS" "$RUNNER_TEMP/wa30_evidence.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA30-$n marker: $count" >&2; exit 1; fi
          done
          echo 'PASS WA30: 27 PG17 checks and 11 real readbacks through typed Node classifier'
