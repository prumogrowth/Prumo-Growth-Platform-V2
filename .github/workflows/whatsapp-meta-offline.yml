name: Prumo Meta - regressao offline integral
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'integrations/whatsapp-meta/**'
      - '.github/workflows/whatsapp-meta-offline.yml'

permissions:
  contents: read

concurrency:
  group: prumo-meta-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node 22 para strip-types sem instalar pacotes do projeto
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressao WhatsApp/Meta completa, somente fixtures
        run: bash integrations/whatsapp-meta/run-offline-tests.sh --all

  wa06d-postgresql-17:
    name: WA-06D PG17 descartavel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Testar restricoes do runner WA-06D, sem SQL real
        run: |
          bash -n integrations/whatsapp-meta/lab/run-wa06d-ephemeral.sh
          python3 -m unittest discover -s integrations/whatsapp-meta/lab -p test_wa06d_ephemeral_runner.py -v
      - name: Criar PostgreSQL 17 descartavel em Docker, sem rede
        run: |
          set -euo pipefail
          docker run --detach --rm --name wa06d-fixture-pg17 \
            --network none \
            --env POSTGRES_USER=wa06d_owner \
            --env POSTGRES_DB=wa06d_test_ephemeral \
            --env POSTGRES_PASSWORD=ci_fixture_only \
            postgres:17 -c listen_addresses=''
          for i in {1..30}; do
            if docker exec wa06d-fixture-pg17 pg_isready -U wa06d_owner -d wa06d_test_ephemeral >/dev/null 2>&1; then
              echo 'PASS WA06D: PostgreSQL 17 sandbox healthy (Unix socket only)'
              exit 0
            fi
            sleep 1
          done
          echo 'FAIL WA06D: disposable PostgreSQL did not start' >&2
          exit 1
      - name: Executar WA-06D 14 casos SQL + 6 casos pos-COMMIT
        run: |
          set -euo pipefail
          sql='integrations/whatsapp-meta/lab'
          docker exec --interactive wa06d-fixture-pg17 psql -X -qAt -v ON_ERROR_STOP=1 \
            -U wa06d_owner -d wa06d_test_ephemeral \
            < "$sql/wa06d_pg17_atomicity.sql" 2>&1 | tee "$RUNNER_TEMP/wa06d_atomicity.log"
          docker exec --interactive wa06d-fixture-pg17 psql -X -qAt -v ON_ERROR_STOP=1 \
            -U wa06d_owner -d wa06d_test_ephemeral \
            < "$sql/wa06d_pg17_postcommit_setup.sql" 2>&1 | tee "$RUNNER_TEMP/wa06d_postcommit_setup.log"
          docker exec --interactive wa06d-fixture-pg17 psql -X -qAt -v ON_ERROR_STOP=1 \
            -U wa06d_owner -d wa06d_test_ephemeral \
            < "$sql/wa06d_pg17_postcommit_verify.sql" 2>&1 | tee "$RUNNER_TEMP/wa06d_postcommit_verify.log"
          for n in {01..14}; do
            count="$(grep -cE "WA06D-$n PASS$" "$RUNNER_TEMP/wa06d_atomicity.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA06D-$n: missing/duplicated pass marker" >&2; exit 1; fi
          done
          for n in {01..06}; do
            count="$(grep -cE "WA06D-B$n PASS:" "$RUNNER_TEMP/wa06d_postcommit_verify.log" || true)"
            if [[ "$count" != 1 ]]; then echo "FAIL WA06D-B$n: missing/duplicated pass marker" >&2; exit 1; fi
          done
          echo 'PASS WA06D: all 20 SQL markers independently verified with 0 psql errors'
      - name: Parar e apagar PostgreSQL descartavel
        if: always()
        run: docker rm --force wa06d-fixture-pg17 >/dev/null 2>&1 || true
