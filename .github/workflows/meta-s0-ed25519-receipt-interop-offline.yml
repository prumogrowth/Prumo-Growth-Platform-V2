name: Meta S0 Ed25519 laboratory receipt interoperability - offline
on:
  push:
    branches: [feat/meta-s0-ed25519-receipt-interop-20261028]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [audit/meta-cloud-http-ack-authority-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s0-receipt-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent Python vector and Ed25519 lab receipt adversarial tests (32)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 integrations/whatsapp-meta/cloud-s0-ed25519-receipt-interop.test.ts 2>&1 | tee "$RUNNER_TEMP/meta-s0-receipt-new.tap"
          grep -qx '# tests 32' "$RUNNER_TEMP/meta-s0-receipt-new.tap"
          grep -qx '# pass 32' "$RUNNER_TEMP/meta-s0-receipt-new.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-s0-receipt-new.tap"
      - name: Existing Meta and S0 interface focused regressions (369)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-http-ack-authority-audit.test.ts \
            integrations/whatsapp-meta/cloud-physical-replay-receipt-audit.test.ts \
            integrations/whatsapp-meta/cloud-batch-scope-preflight.test.ts \
            integrations/whatsapp-meta/meta-s0-readonly-cross-audit.test.ts \
            integrations/whatsapp-meta/s0-handoff-contract.test.ts \
            integrations/whatsapp-meta/cloud-quoted-context-handoff.test.ts \
            integrations/whatsapp-meta/cloud-convergence-scope.test.ts \
            integrations/whatsapp-meta/cloud-composed-identity-guard.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-audit.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-handoff.test.ts \
            integrations/whatsapp-meta/cloud-failed-status-errors-handoff.test.ts \
            integrations/whatsapp-meta/cloud-unsupported-inbound-handoff.test.ts \
            integrations/whatsapp-meta/cloud-media-metadata-handoff.test.ts \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
          grep -qx '# tests 369' "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
          grep -qx '# pass 369' "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
      - name: Protect legacy shape-only ACK helper
        run: node integrations/whatsapp-meta/cloud-ack-runtime-guard.mjs
