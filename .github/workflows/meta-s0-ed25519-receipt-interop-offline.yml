name: Meta S0 Ed25519 laboratory receipt interoperability - offline
on:
  push:
    branches: [feat/meta-s0-ed25519-receipt-interop-20261028, feat/meta-s0-physical-interop-ack-guard-20261031]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [audit/meta-cloud-http-ack-authority-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s0-receipt-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Attest exact source SHA under test
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          printf 'META_SOURCE_SHA=%s\nGITHUB_EVENT_SHA=%s\n' "$actual_sha" "$GITHUB_SHA"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'Meta source SHA: %s\n' "$actual_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent Python vector and Ed25519 lab receipt adversarial tests (36)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 integrations/whatsapp-meta/cloud-s0-ed25519-receipt-interop.test.ts 2>&1 | tee "$RUNNER_TEMP/meta-s0-receipt-new.tap"
          grep -qx '# tests 36' "$RUNNER_TEMP/meta-s0-receipt-new.tap"
          grep -qx '# pass 36' "$RUNNER_TEMP/meta-s0-receipt-new.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-s0-receipt-new.tap"
      - name: Existing Meta and S0 interface focused regressions (369)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-http-ack-authority-audit.test.ts \
            integrations/whatsapp-meta/cloud-physical-replay-receipt-audit.test.ts \
            integrations/whatsapp-meta/cloud-batch-scope-preflight.test.ts \
            integrations/whatsapp-meta/meta-s0-readonly-cross-audit.test.ts \
            integrations/whatsapp-meta/s0-handoff-contract.test.ts \
            integrations/whatsapp-meta/cloud-quoted-context-handoff.test.ts \
            integrations/whatsapp-meta/cloud-convergence-scope.test.ts \
            integrations/whatsapp-meta/cloud-composed-identity-guard.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-audit.test.ts \
            integrations/whatsapp-meta/cloud-composed-observation-handoff.test.ts \
            integrations/whatsapp-meta/cloud-failed-status-errors-handoff.test.ts \
            integrations/whatsapp-meta/cloud-unsupported-inbound-handoff.test.ts \
            integrations/whatsapp-meta/cloud-media-metadata-handoff.test.ts \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
          grep -qx '# tests 369' "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
          grep -qx '# pass 369' "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/meta-s0-receipt-regressions.tap"
      - name: Complete Meta offline regressions (minimum 1183)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 integrations/whatsapp-meta/*.test.ts 2>&1 | tee "$RUNNER_TEMP/meta-full-suite.tap"
          awk '
            /^# tests / { tests=$3 }
            /^# pass / { passed=$3 }
            /^# fail / { failed=$3 }
            /^# skipped / { skipped=$3 }
            END { if (tests < 1183 || passed != tests || failed != 0 || skipped != 0) exit 1 }
          ' "$RUNNER_TEMP/meta-full-suite.tap"
      - name: Protect legacy shape-only ACK helper
        run: node integrations/whatsapp-meta/cloud-ack-runtime-guard.mjs

  s0-physical-meta-consumer:
    if: github.event_name == 'push'
    needs: [s0-receipt-interop]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact Meta commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout frozen independent S0 lab (read-only source)
        uses: actions/checkout@v4
        with:
          repository: prumogrowth/Prumo-Growth-Platform-V2
          ref: 01ffdb093013664b73b18d23f92aac2202578210
          path: s0-reference
          persist-credentials: false
      - name: Verify Git source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C s0-reference rev-parse HEAD)" = "01ffdb093013664b73b18d23f92aac2202578210"
          echo "META_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "S0_LAB_SHA=$(git -C s0-reference rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned S0 laboratory libraries
        run: python -m pip install -r s0-reference/integration/s0_meta_ingress/requirements.txt
      - name: Exercise PG17 receipt from real S0 LAB runtime in Meta consumer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          proofdir="$(mktemp -d "$RUNNER_TEMP/prumo-meta-s0-XXXXXXXX")"
          trap 'rm -rf "$proofdir"' EXIT
          python integrations/whatsapp-meta/lab/emit-s0-physical-receipt.py             "$GITHUB_WORKSPACE/s0-reference" "$proofdir/s0-lab-receipt.json"
          node --experimental-strip-types             integrations/whatsapp-meta/lab/verify-s0-physical-receipt.mjs             "$proofdir/s0-lab-receipt.json"
          echo "PG17 physical LAB receipt consumed by Meta; no HTTP ACK, Graph, S0 production or deploy" >> "$GITHUB_STEP_SUMMARY"
