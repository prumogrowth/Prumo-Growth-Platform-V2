name: Meta Cloud unsupported inbound - offline
on:
  push:
    branches: [feat/meta-cloud-unsupported-inbound-20261027]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/meta-cloud-media-metadata-20261027]
    paths:
      - 'integrations/whatsapp-meta/**'
      - '.github/workflows/meta-cloud-unsupported-inbound-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported-inbound:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New unsupported inbound technical observations (16)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-unsupported-inbound-handoff.test.ts \
            2>&1 | tee "$RUNNER_TEMP/unsupported-new.tap"
          grep -qx '# tests 16' "$RUNNER_TEMP/unsupported-new.tap"
          grep -qx '# pass 16' "$RUNNER_TEMP/unsupported-new.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/unsupported-new.tap"
      - name: Existing media, reaction, selection and HMAC regressions (120)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            integrations/whatsapp-meta/cloud-media-metadata-handoff.test.ts \
            integrations/whatsapp-meta/cloud-reaction-handoff.test.ts \
            integrations/whatsapp-meta/cloud-list-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-button-reply-handoff.test.ts \
            integrations/whatsapp-meta/cloud-webhook-handoff.test.ts \
            integrations/whatsapp-meta/inbound.test.ts \
            integrations/whatsapp-meta/routed-webhook.test.ts \
            2>&1 | tee "$RUNNER_TEMP/unsupported-regressions.tap"
          grep -qx '# tests 120' "$RUNNER_TEMP/unsupported-regressions.tap"
          grep -qx '# pass 120' "$RUNNER_TEMP/unsupported-regressions.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/unsupported-regressions.tap"
